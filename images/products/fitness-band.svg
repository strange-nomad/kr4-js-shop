<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="bandShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f8fafc"/>
  <!-- Ремешок узкий вертикальный -->
  <rect x="180" y="30" width="40" height="240" rx="12" fill="#0f172a" filter="url(#bandShadow)"/>
  <!-- Капсула трекера -->
  <rect x="175" y="85" width="50" height="130" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#bandShadow)"/>
  <!-- Экран AMOLED узкий -->
  <rect x="182" y="97" width="36" height="106" rx="16" fill="#020617"/>
  <!-- Данные на экране -->
  <text x="200" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">08:30</text>
  <path d="M 194 150 Q 197 144 200 150 T 206 150" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="200" y="166" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">128 bpm</text>
  <!-- Прогресс кольцо шагов -->
  <circle cx="200" cy="184" r="7" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="32, 10"/>
  <text x="200" y="260" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">OLED Display &amp; SpO2</text>
</svg>
