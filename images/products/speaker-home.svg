<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="spkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="spkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f8fafc"/>
  <!-- Тень основания -->
  <ellipse cx="200" cy="245" rx="70" ry="14" fill="#cbd5e1"/>
  <!-- Корпус цилиндрический -->
  <rect x="145" y="75" width="110" height="150" rx="30" fill="url(#spkGrad)" filter="url(#spkShadow)"/>
  <!-- Текстура сетки -->
  <line x1="155" y1="110" x2="245" y2="110" stroke="#64748b" stroke-dasharray="3,3" stroke-width="2"/>
  <line x1="155" y1="130" x2="245" y2="130" stroke="#64748b" stroke-dasharray="3,3" stroke-width="2"/>
  <line x1="155" y1="150" x2="245" y2="150" stroke="#64748b" stroke-dasharray="3,3" stroke-width="2"/>
  <line x1="155" y1="170" x2="245" y2="170" stroke="#64748b" stroke-dasharray="3,3" stroke-width="2"/>
  <line x1="155" y1="190" x2="245" y2="190" stroke="#64748b" stroke-dasharray="3,3" stroke-width="2"/>
  <!-- Верхнее светодиодное кольцо (индикатор Алисы/AI) -->
  <ellipse cx="200" cy="75" rx="42" ry="12" fill="url(#ringGrad)"/>
  <text x="200" y="270" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Smart Assistant Built-in</text>
</svg>
