<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="vacShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f8fafc"/>
  <!-- Корпус круглый -->
  <circle cx="200" cy="150" r="95" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#vacShadow)"/>
  <!-- Внутренний круг крышки -->
  <circle cx="200" cy="150" r="75" fill="#f1f5f9"/>
  <!-- Лидар башня -->
  <circle cx="200" cy="120" r="26" fill="#1e293b" filter="url(#vacShadow)"/>
  <circle cx="200" cy="120" r="16" fill="#0284c7"/>
  <circle cx="200" cy="120" r="8" fill="#38bdf8"/>
  <!-- Кнопки управления -->
  <circle cx="200" cy="185" r="12" fill="#e2e8f0"/>
  <circle cx="200" cy="185" r="6" fill="#10b981"/>
  <!-- Бампер передний -->
  <path d="M 120 100 A 95 95 0 0 1 280 100" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <text x="200" y="270" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">LiDAR SLAM Navigation</text>
</svg>
