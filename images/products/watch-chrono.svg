<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="watchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f1f5f9"/>
  <!-- Ремешок -->
  <rect x="160" y="20" width="80" height="260" rx="14" fill="#334155" filter="url(#watchShadow)"/>
  <!-- Корпус часов -->
  <rect x="135" y="75" width="130" height="150" rx="36" fill="url(#watchGrad)" stroke="#475569" stroke-width="4" filter="url(#watchShadow)"/>
  <!-- Экран -->
  <rect x="147" y="87" width="106" height="126" rx="26" fill="url(#screenGrad)"/>
  <!-- Циферблат -->
  <text x="200" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">10:42</text>
  <text x="200" y="168" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ПТ, 18 СЕН</text>
  <!-- Индикатор пульса -->
  <circle cx="178" cy="190" r="4" fill="#ef4444"/>
  <text x="188" y="194" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">72 bpm</text>
  <!-- Коронка управления -->
  <rect x="265" y="115" width="8" height="26" rx="3" fill="#64748b"/>
</svg>
